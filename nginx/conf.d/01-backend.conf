# Backend upstream
upstream django_backend {
    server backend:8000;
    keepalive 32;
}

upstream react_frontend {
    server frontend:3000;
    keepalive 32;
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fko-cleanswitch.com www.fko-cleanswitch.com;

    # SSL certificates - mounted from host
    ssl_certificate /etc/letsencrypt/live/fko-cleanswitch.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fko-cleanswitch.com/privkey.pem;

    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $security_headers always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # File upload size
    client_max_body_size 300M;
    client_body_buffer_size 128k;
    client_body_timeout 60s;

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # Static files
    location /static/ {
        alias /app/staticfiles/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Media files
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        try_files $uri =404;
    }

    # API endpoints - rate limited
    location ~ ^/(api|v1)/ {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://django_backend;
        
        # WebSocket support if needed
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Django admin - stricter rate limiting
    location /admin/ {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://django_backend;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Let's Encrypt ACME challenge
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        default_type "text/plain";
    }

    # Main application - serve React frontend
    location / {
        proxy_pass http://react_frontend;
        
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            proxy_pass http://react_frontend;
        }
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# HTTP redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name fko-cleanswitch.com www.fko-cleanswitch.com;
    
    # Redirect www to non-www HTTPS
    if ($host = www.fko-cleanswitch.com) {
        return 301 https://fko-cleanswitch.com$request_uri;
    }
    
    # Redirect to HTTPS
    return 301 https://$server_name$request_uri;
    
    # Let's Encrypt ACME challenge (for certificate renewal)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
        allow all;
        default_type "text/plain";
    }
}